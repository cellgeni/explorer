name: E2E full (live data)

# Runs every Playwright test, including the ones that load hosted Xenium, Visium HD,
# and H5AD datasets from Sanger object storage and every example in examples/ from its
# repository. Too slow and network-dependent to gate PRs.
on:
  schedule:
    - cron: '0 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E full (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx vite build
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-full
          path: |
            playwright-report/
            test-results/
          retention-days: 14
