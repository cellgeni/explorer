name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - id: install
        run: npm ci

      # Each check runs even if an earlier one failed, so one push reports every problem.
      - name: Prettier
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check
      - name: ESLint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      # The Python console's worker with the real Pyodide (plan 29-D). Its
      # reads need WebAssembly JSPI, which Node 24 has behind a flag; without
      # it `npm test` skips this file.
      - name: Python worker with Pyodide
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --experimental-wasm-jspi ./node_modules/vitest/vitest.mjs run src/workers/pythonCore.pyodide.test.ts
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

  # The console's Python package (src/python), on CPython against a fake bridge.
  # Pyodide runs Python 3.14, so the tests do too.
  python:
    name: Python package tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: '3.14'
      - run: uv run --project src/python pytest src/python/tests

  # Reports coverage and its thresholds without blocking: under V8 coverage
  # the runner is slow enough that timing-sensitive App tests time out
  # (CI #94, #97, #98), while `npm test` above passes.
  coverage:
    name: Unit test coverage (not required)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e-smoke:
    name: E2E smoke (Chromium, offline)
    # Pinned: ubuntu-latest is now 26.04, where Playwright 1.60 cannot install
    # Chromium (1.61 and later can). Every workflow uses the same image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx vite build
      - run: npx playwright test --grep @smoke
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report-smoke
          path: |
            playwright-report/
            test-results/
          retention-days: 7
